name: Feature request
description: A command, a notification, or a limit that should work differently
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        The free plan decides more of this design than taste does. A change that
        adds subrequests per account, or a KV write on every quiet tick, needs a
        plan for that. See [docs/BOT.md](https://github.com/erfnzdeh/gh-notifier-cf-worker/blob/main/docs/BOT.md).
  - type: textarea
    id: want
    attributes:
      label: What you want
      placeholder: A /mute command. Named unstars on repos over 2,000 stargazers. …
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The gap, not the implementation. What do you do today that this would replace?
    validations:
      required: true
  - type: dropdown
    id: cost
    attributes:
      label: Does this add GitHub calls, Telegram sends, or KV writes on the quiet path?
      options:
        - No
        - Yes, and here is how it stays inside the free plan (explain below)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Anything else
      description: Sketches, prior art, or why a workaround is not enough.
